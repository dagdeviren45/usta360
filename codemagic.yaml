workflows:
  ios-workflow:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: usta360
    environment:
      flutter: stable
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.usta360pro2.com" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Flutter build (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Apply profiles and build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mchdtdagvrn@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - mchdtdagvrn@gmail.com
        notify:
          success: true
          failure: true
